openapi: 3.0.3
info:
  title: Petstore API
  description: Sample spec for exercising MockSmith — varied types, formats, arrays and nesting.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A single pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePet
      summary: Delete a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted

  /users/{id}:
    get:
      operationId: getUser
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A user with an explicit example
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: "9f1c2e4a-7b3d-4f88-9c21-5a7e6b0d1234"
                name: "Ada Lovelace"
                email: "ada@example.com"
                role: "admin"

  /payments:
    post:
      operationId: createPayment
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: number, format: double, minimum: 1, maximum: 10000 }
                currency: { type: string, enum: [USD, EUR, BRL] }
      responses:
        '201':
          description: Payment accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string, format: uuid }
                  amount: { type: number, format: double }
                  currency: { type: string, enum: [USD, EUR, BRL] }
                  status: { type: string, enum: [pending, settled, failed] }
                  createdAt: { type: string, format: date-time }
        '503':
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: "Rex"
        tag:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
        photoUrls:
          type: array
          minItems: 2
          items:
            type: string
            format: uri
        owner:
          $ref: '#/components/schemas/User'
        birthDate:
          type: string
          format: date

    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, guest]
        active:
          type: boolean

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
